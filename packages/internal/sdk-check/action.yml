name: Poolster SDK checks
description: Build and test one generated SDK using editable native-language checks or plugin-declared commands.
inputs:
  path:
    description: SDK directory below the checked out repository.
    default: .
  language:
    description: Explicit SDK language; custom languages require package metadata.
    required: true
  setup-only:
    description: Install the language toolchain without rerunning already completed checks.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.language == 'rust'
    - uses: actions/setup-go@v7
      if: inputs.language == 'go' || inputs.language == 'terraform'
      with:
        go-version: '1.25.7'
    - uses: actions/setup-python@v7
      if: inputs.language == 'python'
      with:
        python-version: '3.12'
    - uses: shivammathur/setup-php@v2
      if: inputs.language == 'php' || inputs.language == 'symfony'
      with:
        php-version: '8.2'
    - uses: actions/setup-java@v6
      if: inputs.language == 'java'
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v6
      if: inputs.language == 'csharp' || inputs.language == 'dotnet'
      with:
        dotnet-version: '8.0.x'
    - uses: erlef/setup-beam@v1
      if: inputs.language == 'elixir'
      with:
        otp-version: '27.0'
        elixir-version: '1.17.3'
    - uses: ruby/setup-ruby@v1
      if: inputs.language == 'ruby'
      with:
        ruby-version: '3.1'
    - name: Run SDK checks
      if: inputs.setup-only != 'true'
      shell: bash
      env:
        SDK_PATH: ${{ inputs.path }}
        SDK_LANGUAGE: ${{ inputs.language }}
        CHECK_SCRIPT: ${{ github.action_path }}/check.mjs
      run: node "$CHECK_SCRIPT"
