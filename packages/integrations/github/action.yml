name: Poolster generate
description: Generate Poolster SDKs from an OpenAPI contract in GitHub Actions.
author: Relevate
branding:
  icon: box
  color: purple

inputs:
  config:
    description: Path to poolster.json relative to working-directory.
    required: false
    default: poolster.json
  version:
    description: npm version or dist-tag for poolster.
    required: false
    default: latest
  working-directory:
    description: Directory in which Poolster runs.
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Generate SDKs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POOLSTER_CONFIG: ${{ inputs.config }}
        POOLSTER_VERSION: ${{ inputs.version }}
      run: npx --yes "poolster@$POOLSTER_VERSION" generate --config "$POOLSTER_CONFIG"
