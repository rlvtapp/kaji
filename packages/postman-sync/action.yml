name: Kaji Postman synchronization
description: Compare or publish an explicitly reviewed collection to an existing Postman collection
inputs:
  collection:
    description: Generated collection file
    required: true
  uid:
    description: Existing destination collection UID
    required: true
  api-key:
    description: Postman API key; pass a repository or environment secret
    required: true
  mode:
    description: check (read only) or publish
    default: check
  expected-hash:
    description: Reviewed remoteHash from check; required for changed publication
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - shell: bash
      env:
        KAJI_POSTMAN_COLLECTION: ${{ inputs.collection }}
        KAJI_POSTMAN_UID: ${{ inputs.uid }}
        KAJI_POSTMAN_API_KEY: ${{ inputs.api-key }}
        KAJI_POSTMAN_MODE: ${{ inputs.mode }}
        KAJI_POSTMAN_EXPECTED_HASH: ${{ inputs.expected-hash }}
      run: node "$GITHUB_ACTION_PATH/sync.mjs"
