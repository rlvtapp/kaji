name: Poolster Postman synchronization
description: Compare or publish an explicitly reviewed environment to an existing Postman environment
inputs:
  environment:
    description: Generated environment file
    required: true
  uid:
    description: Existing destination environment UID
    required: true
  api-key:
    description: Postman API key; pass a repository or environment secret
    required: true
  mode:
    description: check (read only) or publish
    default: check
  expected-hash:
    description: Reviewed remoteHash from check; required for changed publication
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - shell: bash
      env:
        POOLSTER_POSTMAN_ENVIRONMENT: ${{ inputs.environment }}
        POOLSTER_POSTMAN_UID: ${{ inputs.uid }}
        POOLSTER_POSTMAN_API_KEY: ${{ inputs.api-key }}
        POOLSTER_POSTMAN_MODE: ${{ inputs.mode }}
        POOLSTER_POSTMAN_EXPECTED_HASH: ${{ inputs.expected-hash }}
      run: node "$GITHUB_ACTION_PATH/../environment.mjs"
