name: Large public contracts
on:
  workflow_dispatch:
    inputs:
      contract:
        description: Immutable official contract to verify
        type: choice
        default: openai
        options: [stripe, github, openai, twilio, digital-ocean, linode]
permissions:
  contents: read
jobs:
  native:
    name: ${{ inputs.contract }} / ${{ matrix.language }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Rust
            path: rust
            runner: ubuntu-latest
          - language: TypeScript
            path: typescript
            runner: ubuntu-latest
          - language: Go
            path: go
            runner: ubuntu-latest
          - language: Python
            path: python
            runner: ubuntu-latest
          - language: PHP
            path: php
            runner: ubuntu-latest
          - language: Java
            path: java
            runner: ubuntu-latest
          - language: C#
            path: csharp
            runner: ubuntu-latest
          - language: Elixir
            path: elixir
            runner: ubuntu-latest
          - language: Ruby
            path: ruby
            runner: ubuntu-latest
          - language: Swift
            path: swift
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Install explicit TypeScript compiler for the runtime probe
        if: matrix.language == 'TypeScript'
        run: |
          npm install --prefix "$RUNNER_TEMP/poolster-runtime-ts" --no-audit --no-fund typescript@5.9.3
          echo "POOLSTER_TSC_JS=$RUNNER_TEMP/poolster-runtime-ts/node_modules/typescript/lib/tsc.js" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        if: matrix.language == 'Go'
        with:
          go-version: '1.25.7'
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'PHP'
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-java@v6
        if: matrix.language == 'Java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'C#'
        with:
          dotnet-version: '8.0.x'
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'Elixir'
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'Ruby'
        with:
          ruby-version: '3.3'
      - name: Initialize Hex for the generated Elixir runtime probe
        if: matrix.language == 'Elixir'
        run: mix local.hex --force && mix local.rebar --force
      - name: Build generator
        run: cargo build --locked -p poolster-cli
      - name: Generate and compile pinned public contract
        env:
          POOLSTER_BINARY: ${{ github.workspace }}/target/debug/poolster
          POOLSTER_PUBLIC_CONTRACT_MANIFEST: ${{ github.workspace }}/scripts/fixtures/large-contracts.json
          POOLSTER_PUBLIC_CONTRACT_ROOT: ${{ runner.temp }}/large-contract
          POOLSTER_PUBLIC_CONTRACTS: ${{ inputs.contract }}
          POOLSTER_PUBLIC_LANGUAGES: ${{ matrix.path }}
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/swift-clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/swift-modules
        run: |
          set -euo pipefail
          mkdir -p "$POOLSTER_PUBLIC_CONTRACT_ROOT/logs"
          bash scripts/test-public-contracts.sh generate 2>&1 | tee "$POOLSTER_PUBLIC_CONTRACT_ROOT/logs/generate.log"
          bash scripts/test-public-contracts.sh check "${{ matrix.path }}" 2>&1 | tee "$POOLSTER_PUBLIC_CONTRACT_ROOT/logs/native.log"
      - name: Keep generation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.contract }}-${{ matrix.path }}-metadata
          path: |
            ${{ runner.temp }}/large-contract/**/.poolster
            ${{ runner.temp }}/large-contract/logs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
