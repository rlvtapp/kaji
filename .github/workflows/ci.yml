name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test CI integration templates
        run: node --test packages/github-action/test/*.test.cjs packages/gitlab-ci/test/*.test.cjs
      - name: Test Python CLI launcher
        run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...

  generated-contract:
    name: Generated SDK contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - run: cargo test -p kaji --test sdk_to_mock_contract -- --ignored

  generated-rust:
    name: Compile generated Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kaji-plugin-rust generated_retry_runtime_compiles_warning_free -- --ignored

  generated-csharp:
    name: Compile generated C# SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: cargo test -p kaji-plugin-csharp generated_csharp_project_builds_with_dotnet -- --ignored

  generated-typescript:
    name: Compile generated TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install TypeScript compiler
        run: npm install --prefix "$RUNNER_TEMP/kaji-typescript" --no-save typescript
      - name: Compile strict generated consumer
        run: >-
          KAJI_TSC_JS="$RUNNER_TEMP/kaji-typescript/node_modules/typescript/lib/tsc.js"
          cargo test -p kaji-plugin-typescript
          generated_fetch_consumer_compiles_with_strict_typescript -- --ignored

  generated-java:
    name: Compile generated Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: cargo test -p kaji-plugin-java generated_package_compiles_with_maven -- --ignored

  generated-php:
    name: Lint generated PHP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: cargo test -p kaji-plugin-php generated_package_passes_php_syntax_checks -- --ignored

  generated-python:
    name: Validate generated Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo test -p kaji-plugin-python generated_package_is_valid_python
      - run: cargo test -p kaji-plugin-python partitions_model_exports_without_changing_model_imports

  generated-swift:
    name: Compile generated Swift SDK
    runs-on: macos-14
    env:
      CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/kaji-swift-cache/clang
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/kaji-swift-cache/swiftpm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kaji-plugin-swift generated_package_builds_with_swiftpm -- --ignored
