name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test CI integration templates
        run: node --test packages/github-action/test/*.test.cjs packages/gitlab-ci/test/*.test.cjs
      - name: Test Python CLI launcher
        run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
      - name: Run generated SDK contract suite
        run: cargo test -p kaji --test sdk_to_mock_contract -- --ignored
