name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "0.5.0"]

permissions:
  contents: read

jobs:
  workspace:
    name: Build generator and generate SDK fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check authored source size ratchet
        run: python scripts/layout-audit.py --check-source-size
      - name: Test CI integration templates
        run: |
          node --test packages/github-action/test/*.test.cjs packages/gitlab-ci/test/*.test.cjs
          python3 scripts/test-public-contracts.test.py
          python3 scripts/test-guru-corpus.py
      - name: Test editable SDK delivery and App broker sources
        run: node --test packages/sdk-check/test/*.mjs packages/sdk-publish/test/*.mjs packages/github-app-broker/*.test.mjs packages/spec-sync/test/*.test.mjs packages/sdk-delivery-test/test/*.test.mjs packages/runtime-contract/test.mjs packages/postman-sync/test/*.mjs
      - name: Test portable collection checker
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python -m unittest discover -s packages/postman-check/test -v
      - name: Test Python CLI launcher
        run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - name: Test workspace release version updates
        run: |
          npm install --prefix "$RUNNER_TEMP/kaji-release-check" --ignore-scripts --no-audit --no-fund release-please@17.6.0
          NODE_PATH="$RUNNER_TEMP/kaji-release-check/node_modules" node --test scripts/release-config.test.cjs
      - name: Build OpenAPI compiler for CLI integration tests
        working-directory: openapi
        run: go build -o ../target/debug/poolster-openapi .
      - name: Verify Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo test -p poolster-cli combined_optional_recipe_validates_actual_json_schema -- --ignored
          cargo test -p poolster-cli eject::tests::rebuilt_ejected_renderer_consumes_custom_source -- --ignored
          cargo test -p poolster-cli --test local_references -- --ignored
          cargo test -p poolster-cli --test migration -- --ignored
      - name: Verify generated TypeScript middleware and response decoding
        run: |
          npm install --prefix "$RUNNER_TEMP/kaji-ts-runtime" --no-audit --no-fund typescript@5.9.3 axios@1.20.0
          export KAJI_TSC_JS="$RUNNER_TEMP/kaji-ts-runtime/node_modules/typescript/lib/tsc.js"
          export KAJI_AXIOS_NODE_MODULES="$RUNNER_TEMP/kaji-ts-runtime/node_modules"
          export KAJI_TS_AXIOS_NODE_MODULES="$RUNNER_TEMP/kaji-ts-runtime/node_modules"
          cargo test -p poolster-plugin-typescript generated_middleware_fetch_and_axios_execute -- --ignored
          cargo test -p poolster-plugin-typescript generated_idempotency_fetch_and_axios_execute -- --ignored
          cargo test -p poolster-plugin-typescript bundled_middleware_is_enabled_without_customer_registration -- --ignored
          cargo test -p poolster-plugin-typescript generated_lossless_fetch_axios_and_sse_round_trip -- --ignored
          cargo test -p poolster-plugin-typescript generated_page_pagination_executes_defaults_and_selectors -- --ignored
          cargo test -p poolster-plugin-typescript native_generated_fetch_and_axios_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-typescript native_standard_webhook_vectors_execute -- --ignored
          cargo test -p poolster-plugin-typescript native_oauth_singleflight_replay_cancellation_and_redaction -- --ignored
          cargo test -p poolster-plugin-typescript native_fetch_and_axios_per_call -- --ignored
          cargo test -p poolster-plugin-typescript native_whole_query_and_json_sequences -- --ignored
          cargo test -p poolster-plugin-typescript native_open_enum_types_accept_future_values_and_preserve_wire -- --ignored
          cargo test -p poolster-cli --test openapi32 -- --ignored
      - name: Verify framework factories and split auxiliary/CLI modules
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          npm install --prefix "$RUNNER_TEMP/kaji-ts-framework" --no-audit --no-fund typescript@5.9.3 @types/node@22.20.5 commander@13.1.0 react@19.3.0 @types/react@19.3.0 vue@3.5.43 @tanstack/react-query@5.104.1 @tanstack/vue-query@5.104.1 swr@2.5.1 zod@3.25.76 @faker-js/faker@9.9.0 msw@2.15.0 cypress@15.21.1
          export KAJI_TSC_JS="$RUNNER_TEMP/kaji-ts-framework/node_modules/typescript/lib/tsc.js"
          export KAJI_TS_NODE_MODULES="$RUNNER_TEMP/kaji-ts-framework/node_modules"
          export KAJI_TS_CLI_NODE_MODULES="$KAJI_TS_NODE_MODULES"
          cargo test -p poolster-plugin-typescript query_factories_cache_callbacks_and_abort_execute_natively -- --ignored
          cargo test -p poolster-plugin-typescript namespaced_and_auxiliary_consumers_compile_and_validate_selected_models -- --ignored
          cargo test -p poolster-plugin-typescript custom_transport_and_relocated_query_consumer_compile -- --ignored
          cargo test -p poolster-plugin-typescript-cli split_commands_compile_and_show_last_chunk_in_help -- --ignored
          cargo test -p poolster-plugin-rust-cli split_commands_compile_and_show_last_chunk_in_help -- --ignored
      - name: Verify generated Postman exports against the official schema
        run: cargo test -p poolster-plugin-postman validates_actual_official_draft04_schema -- --ignored
      - name: Verify exported collections with Newman against a local mock
        run: |
          npm ci --prefix packages/postman-execute --ignore-scripts --no-audit --no-fund
          node --test packages/postman-execute/test/*.test.mjs
          cargo test -p poolster-plugin-postman generated_collection_executes_with_newman_local_mock -- --ignored
      - name: Verify generated Terraform lifecycle with native Framework state
        run: |
          cargo test -p poolster-plugin-terraform generated_provider_executes_native_framework_lifecycle -- --ignored
          cargo test -p poolster-plugin-terraform generated_nested_provider_executes_native_framework_lifecycle -- --ignored
          cargo test -p poolster-plugin-terraform generated_composite_provider_executes_native_framework_lifecycle -- --ignored
          cargo test -p poolster-plugin-terraform generated_polling_provider_executes_native_framework_lifecycle -- --ignored
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.4'
          terraform_wrapper: false
      - name: Verify Terraform CLI lifecycle against a local mock API
        run: |
          cargo test -p poolster-plugin-terraform terraform_cli_local_mock_lifecycle -- --ignored
          cargo test -p poolster-plugin-terraform terraform_cli_polling_local_mock_lifecycle -- --ignored
      - name: Verify standalone typed plugin authoring example
        run: |
          cargo test --manifest-path examples/custom-plugin/Cargo.toml --locked
          cargo run --manifest-path examples/custom-plugin/Cargo.toml --locked -- "$RUNNER_TEMP/custom-plugin-output"
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
      - name: Run generated SDK contract suite
        run: cargo test -p poolster --test sdk_to_mock_contract -- --ignored
      - name: Build Poolster once
        run: |
          cargo build -p poolster-cli --locked
          (cd openapi && go build -o ../target/debug/poolster-openapi .)
      - name: Verify local delivery generation drift and previews
        run: node packages/sdk-delivery-test/delivery.mjs --mode local --binary "$GITHUB_WORKSPACE/target/debug/poolster"
      - name: Export shared native runtime contract fixture
        env:
          KAJI_RUNTIME_EXPORT: ${{ runner.temp }}/runtime-contract-fixture
        run: cargo test -p poolster --test runtime_conformance --locked
      - name: Verify installed TypeScript ESM package and consumer types
        env:
          KAJI_PACKAGE_FIXTURE: ${{ runner.temp }}/runtime-contract-fixture/sdk/typescript
          KAJI_TSC_JS: ${{ runner.temp }}/kaji-ts-runtime/node_modules/typescript/lib/tsc.js
        run: node --test packages/runtime-contract/package-consumer.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-contract-fixture
          path: ${{ runner.temp }}/runtime-contract-fixture
          include-hidden-files: true
          retention-days: 1
      - name: Verify portable API artifacts
        run: |
          target/debug/poolster generate --config examples/api-artifacts/poolster.json
          POOLSTER_COLLECTION=examples/api-artifacts/generated/postman/widgets.postman_collection.json POOLSTER_ENVIRONMENT=examples/api-artifacts/generated/postman/widgets.postman_environment.json python packages/postman-check/check.py
          (cd examples/api-artifacts/generated/terraform && go mod tidy && go test ./... && go build ./...)
          target/debug/poolster generate --config examples/api-artifacts/poolster.json --check --format json
      - name: Verify release examples
        run: python scripts/check-release-examples.py
      - name: Generate checksum-pinned public contracts for every SDK target
        env:
          POOLSTER_BINARY: ${{ github.workspace }}/target/debug/poolster
          KAJI_PUBLIC_CONTRACT_ROOT: ${{ runner.temp }}/public-contract-fixtures
        run: bash scripts/test-public-contracts.sh generate
      - uses: actions/upload-artifact@v7
        with:
          name: public-contract-fixtures
          path: ${{ runner.temp }}/public-contract-fixtures
          include-hidden-files: true
          retention-days: 1
      - name: Generate cross-language SDK fixture once
        run: >-
          target/debug/poolster generate crates/kaji-cli/tests/fixtures/pets.yaml
          --output "$RUNNER_TEMP/generated-sdk-fixture"
          --language rust,typescript,go,python,php,java,csharp,elixir,ruby,swift
          --name "CI Pets" --sdk-version 1.0.0 --color never
      - uses: actions/upload-artifact@v7
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
          include-hidden-files: true
          retention-days: 1

  generated-sdk:
    name: Validate generated ${{ matrix.language }} SDK
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Rust
            path: rust
            runner: ubuntu-latest
          - language: TypeScript
            path: typescript
            runner: ubuntu-latest
          - language: Go
            path: go
            runner: ubuntu-latest
          - language: Python
            path: python
            runner: ubuntu-latest
          - language: PHP
            path: php
            runner: ubuntu-latest
          - language: Java
            path: java
            runner: ubuntu-latest
          - language: C#
            path: csharp
            runner: ubuntu-latest
          - language: Elixir
            path: elixir
            runner: ubuntu-latest
          - language: Ruby
            path: ruby
            runner: ubuntu-latest
          - language: Swift
            path: swift
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Swift 6 toolchain for native probes
        if: matrix.language == 'Swift'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer swift --version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: runtime-contract-fixture
          path: ${{ runner.temp }}/runtime-contract-fixture
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Rust'
      - name: Install explicit TypeScript compiler for the runtime probe
        if: matrix.language == 'TypeScript'
        run: |
          npm install --prefix "$RUNNER_TEMP/kaji-runtime-ts" --no-audit --no-fund typescript@5.9.3
          echo "KAJI_TSC_JS=$RUNNER_TEMP/kaji-runtime-ts/node_modules/typescript/lib/tsc.js" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        if: matrix.language == 'Go' || matrix.language == 'Swift'
        with:
          go-version: '1.25.7'
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'PHP'
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-java@v6
        if: matrix.language == 'Java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'C#'
        with:
          dotnet-version: '8.0.x'
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'Elixir'
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'Ruby'
        with:
          ruby-version: '3.3'
      - name: Initialize Hex for the generated Elixir runtime probe
        if: matrix.language == 'Elixir'
        run: mix local.hex --force && mix local.rebar --force
      - uses: actions/download-artifact@v7
        with:
          name: public-contract-fixtures
          path: ${{ runner.temp }}/public-contract-fixtures
      - name: Compile pinned public contracts with the native language toolchain
        env:
          KAJI_PUBLIC_CONTRACT_ROOT: ${{ runner.temp }}/public-contract-fixtures
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/kaji-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/kaji-swift-cache/swiftpm
        run: bash scripts/test-public-contracts.sh check "${{ matrix.path }}"
      - name: Validate generated SDK
        working-directory: ${{ runner.temp }}/generated-sdk-fixture/${{ matrix.path }}
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/kaji-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/kaji-swift-cache/swiftpm
        run: |
          case "${{ matrix.language }}" in
            Rust) cargo test ;;
            TypeScript) npm install --ignore-scripts && npm run build ;;
            Go) go test ./... ;;
            Python) python -m compileall -q src && PYTHONPATH=src python -c 'import ci_pets_sdk' ;;
            PHP) find src -name '*.php' -print0 | xargs -0 -n1 php -l ;;
            Java) mvn --batch-mode --no-transfer-progress -q -DskipTests compile ;;
            C#) dotnet build --configuration Release --disable-build-servers -p:UseSharedCompilation=false ;;
            Elixir) mix deps.get && mix compile --warnings-as-errors ;;
            Ruby) find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c ;;
            Swift) swift build --disable-sandbox ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Swift' || matrix.language == 'Elixir' || matrix.language == 'PHP' || matrix.language == 'Java' || matrix.language == 'C#'
      - name: Verify native Python multipart sync and async HTTP bytes
        if: matrix.language == 'Python'
        run: |
          python -m pip install --disable-pip-version-check 'httpx==0.28.1'
          POOLSTER_TEST_PYTHON=python3 cargo test -p poolster-plugin-python native_multipart_sync_async_preserve_mime_and_retry_bytes -- --ignored
      - name: Verify generated Java retry parsers
        if: matrix.language == 'Java'
        run: |
          cargo test -p poolster-plugin-java generated_retry_parsers_execute_with_jdk -- --ignored
          cargo test -p poolster-plugin-java native_webhook_verification_executes_canonical_vectors -- --ignored
          cargo test -p poolster-plugin-java native_generated_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-java native_models_preserve_alias_union_and_unknown_enum_wire_values -- --ignored
          cargo test -p poolster-plugin-java native_omitted_and_null_presence_roundtrip -- --ignored
          cargo test -p poolster-plugin-java native_multipart_http_bytes_preserve_unicode_falsy_and_binary -- --ignored
          cargo test -p poolster-plugin-java native_multipart_complex_json_and_repeated_arrays -- --ignored
          cargo test -p poolster-plugin-java native_oauth_cache_singleflight_replay_origin_and_interruption -- --ignored
          cargo test -p poolster-plugin-java native_call_scopes_preserve_headers_timeouts_and_original_client -- --ignored
      - name: Verify generated C# retry parser
        if: matrix.language == 'C#'
        run: |
          cargo test -p poolster-plugin-csharp generated_retry_parser_executes_with_dotnet -- --ignored
          cargo test -p poolster-plugin-csharp generated_sse_framing_executes_with_dotnet -- --ignored
          cargo test -p poolster-plugin-csharp native_webhook_verification_executes_canonical_vectors -- --ignored
          cargo test -p poolster-plugin-csharp native_generated_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-csharp native_models_preserve_alias_union_and_unknown_enum_wire_values -- --ignored
          cargo test -p poolster-plugin-csharp native_omitted_and_null_presence_roundtrip -- --ignored
          cargo test -p poolster-plugin-csharp native_multipart_http_bytes_preserve_unicode_falsy_and_binary -- --ignored
          cargo test -p poolster-plugin-csharp native_multipart_complex_json_and_repeated_arrays -- --ignored
          cargo test -p poolster-plugin-csharp native_oauth_cache_singleflight_replay_origin_and_cancellation -- --ignored
          cargo test -p poolster-plugin-csharp native_call_scopes_preserve_headers_and_cancel_timeout_without_mutation -- --ignored
      - name: Verify all native PHP probes
        if: matrix.language == 'PHP'
        env:
          KAJI_PHP_AUTOLOAD: ${{ runner.temp }}/generated-sdk-fixture/php/vendor/autoload.php
        run: |
          composer install --working-dir="$RUNNER_TEMP/generated-sdk-fixture/php" --no-interaction --no-progress
          cargo test -p poolster-plugin-php -- --ignored
      - name: Verify all native Elixir probes
        if: matrix.language == 'Elixir'
        env:
          KAJI_ELIXIR_NATIVE_PROJECT: ${{ runner.temp }}/generated-sdk-fixture/elixir
        run: cargo test -p poolster-plugin-elixir -- --ignored
      - name: Verify native Swift middleware models pagination and cancellation
        if: matrix.language == 'Swift'
        run: cargo test -p poolster-plugin-swift -- --ignored
      - name: Verify complex OpenAPI contract through native Swift SDK
        if: matrix.language == 'Swift'
        env:
          POOLSTER_OPENAPI_BIN: ${{ github.workspace }}/target/debug/poolster-openapi
        run: |
          (cd openapi && go build -o ../target/debug/poolster-openapi .)
          cargo test -p poolster --test complex_contract -- --ignored
      - name: Verify native C# URL pagination
        if: matrix.language == 'C#'
        run: cargo test -p poolster-plugin-csharp native_url_pages_reject_unsafe_origins_preserve_auth_and_cancel_lazily -- --ignored
      - name: Verify generated Rust operation tests
        if: matrix.language == 'Rust'
        run: |
          cargo test -p poolster-plugin-rust native_generated_rust_operation_tests_execute -- --ignored
          cargo test -p poolster-plugin-rust native_url_pages_preserve_origin_auth_and_raw_error_responses -- --ignored
          cargo test -p poolster-plugin-rust native_standard_webhook_vectors_execute -- --ignored
          cargo test -p poolster-plugin-rust native_oauth_singleflight_replay_and_dropped_refresh_are_safe -- --ignored
          cargo test -p poolster-plugin-rust native_unknown_union_roundtrips_and_default_decoding_remains_strict -- --ignored
          cargo test -p poolster-plugin-rust native_nested_future_enum_absent_null_and_unknown_fields_roundtrip -- --ignored
          cargo test -p poolster-plugin-rust native_multipart_buffered_parts_preserve_bytes_and_safe_retries -- --ignored
      - name: Execute generated public operations against shared runtime scenarios
        run: node packages/runtime-contract/runner.mjs "${{ matrix.path }}" "$RUNNER_TEMP/runtime-contract-fixture/sdk/${{ matrix.path }}"
