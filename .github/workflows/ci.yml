name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
      - name: Run generated SDK contract suite
        run: cargo test -p kaji --test sdk_to_mock_contract -- --ignored
