name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "0.5.0"]

permissions:
  contents: read

jobs:
  workspace:
    name: Build generator and generate SDK fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test CI integration templates
        run: |
          node --test packages/github-action/test/*.test.cjs packages/gitlab-ci/test/*.test.cjs
          python3 scripts/test-public-contracts.test.py
      - name: Test editable SDK delivery and App broker sources
        run: node --test packages/sdk-check/test/*.mjs packages/sdk-publish/test/*.mjs packages/github-app-broker/*.test.mjs packages/spec-sync/test/*.test.mjs packages/sdk-delivery-test/test/*.test.mjs packages/runtime-contract/test.mjs packages/postman-sync/test/*.mjs
      - name: Test portable collection checker
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python -m unittest discover -s packages/postman-check/test -v
      - name: Test Python CLI launcher
        run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - name: Verify Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
      - name: Verify generated TypeScript middleware and response decoding
        run: |
          npm install --prefix "$RUNNER_TEMP/kaji-ts-runtime" --no-audit --no-fund typescript@5.9.3 axios@1.20.0
          export KAJI_TSC_JS="$RUNNER_TEMP/kaji-ts-runtime/node_modules/typescript/lib/tsc.js"
          export KAJI_AXIOS_NODE_MODULES="$RUNNER_TEMP/kaji-ts-runtime/node_modules"
          cargo test -p kaji-plugin-typescript generated_middleware_fetch_and_axios_execute -- --ignored
          cargo test -p kaji-plugin-typescript generated_idempotency_fetch_and_axios_execute -- --ignored
          cargo test -p kaji-plugin-typescript bundled_middleware_is_enabled_without_customer_registration -- --ignored
          cargo test -p kaji-plugin-typescript generated_lossless_fetch_axios_and_sse_round_trip -- --ignored
          cargo test -p kaji-plugin-typescript generated_page_pagination_executes_defaults_and_selectors -- --ignored
          cargo test -p kaji-plugin-typescript native_generated_fetch_and_axios_operation_tests_execute -- --ignored
          cargo test -p kaji-plugin-typescript native_standard_webhook_vectors_execute -- --ignored
      - name: Verify generated Postman exports against the official schema
        run: cargo test -p kaji-plugin-postman validates_actual_official_draft04_schema -- --ignored
      - name: Verify exported collections with Newman against a local mock
        run: |
          npm ci --prefix packages/postman-execute --ignore-scripts --no-audit --no-fund
          node --test packages/postman-execute/test/*.test.mjs
          cargo test -p kaji-plugin-postman generated_collection_executes_with_newman_local_mock -- --ignored
      - name: Verify generated Terraform lifecycle with native Framework state
        run: |
          cargo test -p kaji-plugin-terraform generated_provider_executes_native_framework_lifecycle -- --ignored
          cargo test -p kaji-plugin-terraform generated_nested_provider_executes_native_framework_lifecycle -- --ignored
          cargo test -p kaji-plugin-terraform generated_composite_provider_executes_native_framework_lifecycle -- --ignored
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.4'
          terraform_wrapper: false
      - name: Verify Terraform CLI lifecycle against a local mock API
        run: cargo test -p kaji-plugin-terraform terraform_cli_local_mock_lifecycle -- --ignored
      - name: Verify standalone typed plugin authoring example
        run: |
          cargo test --manifest-path examples/custom-plugin/Cargo.toml --locked
          cargo run --manifest-path examples/custom-plugin/Cargo.toml --locked -- "$RUNNER_TEMP/custom-plugin-output"
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
      - name: Run generated SDK contract suite
        run: cargo test -p kaji --test sdk_to_mock_contract -- --ignored
      - name: Build Kaji once
        run: |
          cargo build -p kaji-cli --locked
          (cd openapi && go build -o ../target/debug/kaji-openapi .)
      - name: Verify local delivery generation drift and previews
        run: node packages/sdk-delivery-test/delivery.mjs --mode local --binary "$GITHUB_WORKSPACE/target/debug/kaji"
      - name: Export shared native runtime contract fixture
        env:
          KAJI_RUNTIME_EXPORT: ${{ runner.temp }}/runtime-contract-fixture
        run: cargo test -p kaji --test runtime_conformance --locked
      - name: Verify installed TypeScript ESM package and consumer types
        env:
          KAJI_PACKAGE_FIXTURE: ${{ runner.temp }}/runtime-contract-fixture/sdk/typescript
          KAJI_TSC_JS: ${{ runner.temp }}/kaji-ts-runtime/node_modules/typescript/lib/tsc.js
        run: node --test packages/runtime-contract/package-consumer.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-contract-fixture
          path: ${{ runner.temp }}/runtime-contract-fixture
          include-hidden-files: true
          retention-days: 1
      - name: Verify portable API artifacts
        run: |
          target/debug/kaji generate --config examples/api-artifacts/kaji.json
          KAJI_COLLECTION=examples/api-artifacts/generated/postman/widgets.postman_collection.json KAJI_ENVIRONMENT=examples/api-artifacts/generated/postman/widgets.postman_environment.json python packages/postman-check/check.py
          (cd examples/api-artifacts/generated/terraform && go mod tidy && go test ./... && go build ./...)
          target/debug/kaji generate --config examples/api-artifacts/kaji.json --check --format json
      - name: Verify release examples
        run: python scripts/check-release-examples.py
      - name: Generate checksum-pinned public contracts for every SDK target
        env:
          KAJI_BINARY: ${{ github.workspace }}/target/debug/kaji
          KAJI_PUBLIC_CONTRACT_ROOT: ${{ runner.temp }}/public-contract-fixtures
        run: bash scripts/test-public-contracts.sh generate
      - uses: actions/upload-artifact@v7
        with:
          name: public-contract-fixtures
          path: ${{ runner.temp }}/public-contract-fixtures
          include-hidden-files: true
          retention-days: 1
      - name: Generate cross-language SDK fixture once
        run: >-
          target/debug/kaji generate crates/kaji-cli/tests/fixtures/pets.yaml
          --output "$RUNNER_TEMP/generated-sdk-fixture"
          --language rust,typescript,go,python,php,java,csharp,elixir,ruby,swift
          --name "CI Pets" --sdk-version 1.0.0 --color never
      - uses: actions/upload-artifact@v7
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
          include-hidden-files: true
          retention-days: 1

  generated-sdk:
    name: Validate generated ${{ matrix.language }} SDK
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Rust
            path: rust
            runner: ubuntu-latest
          - language: TypeScript
            path: typescript
            runner: ubuntu-latest
          - language: Go
            path: go
            runner: ubuntu-latest
          - language: Python
            path: python
            runner: ubuntu-latest
          - language: PHP
            path: php
            runner: ubuntu-latest
          - language: Java
            path: java
            runner: ubuntu-latest
          - language: C#
            path: csharp
            runner: ubuntu-latest
          - language: Elixir
            path: elixir
            runner: ubuntu-latest
          - language: Ruby
            path: ruby
            runner: ubuntu-latest
          - language: Swift
            path: swift
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: runtime-contract-fixture
          path: runtime-contract-fixture
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdk-fixture
          path: generated-sdk-fixture
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Rust'
      - name: Install explicit TypeScript compiler for the runtime probe
        if: matrix.language == 'TypeScript'
        run: |
          npm install --prefix "$RUNNER_TEMP/kaji-runtime-ts" --no-audit --no-fund typescript@5.9.3
          echo "KAJI_TSC_JS=$RUNNER_TEMP/kaji-runtime-ts/node_modules/typescript/lib/tsc.js" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        if: matrix.language == 'Go'
        with:
          go-version: '1.25.7'
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'PHP'
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-java@v6
        if: matrix.language == 'Java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'C#'
        with:
          dotnet-version: '8.0.x'
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'Elixir'
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'Ruby'
        with:
          ruby-version: '3.3'
      - name: Initialize Hex for the generated Elixir runtime probe
        if: matrix.language == 'Elixir'
        run: mix local.hex --force && mix local.rebar --force
      - uses: actions/download-artifact@v7
        with:
          name: public-contract-fixtures
          path: public-contract-fixtures
      - name: Compile pinned public contracts with the native language toolchain
        env:
          KAJI_PUBLIC_CONTRACT_ROOT: ${{ github.workspace }}/public-contract-fixtures
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/kaji-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/kaji-swift-cache/swiftpm
        run: bash scripts/test-public-contracts.sh check "${{ matrix.path }}"
      - name: Validate generated SDK
        working-directory: generated-sdk-fixture/${{ matrix.path }}
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/kaji-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/kaji-swift-cache/swiftpm
        run: |
          case "${{ matrix.language }}" in
            Rust) cargo test ;;
            TypeScript) npm install --ignore-scripts && npm run build ;;
            Go) go test ./... ;;
            Python) python -m compileall -q src && PYTHONPATH=src python -c 'import ci_pets_sdk' ;;
            PHP) find src -name '*.php' -print0 | xargs -0 -n1 php -l ;;
            Java) mvn --batch-mode --no-transfer-progress -q -DskipTests compile ;;
            C#) dotnet build --configuration Release ;;
            Elixir) mix deps.get && mix compile --warnings-as-errors ;;
            Ruby) find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c ;;
            Swift) swift build --disable-sandbox ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Swift' || matrix.language == 'Elixir' || matrix.language == 'PHP' || matrix.language == 'Java' || matrix.language == 'C#'
      - name: Verify generated Java retry parsers
        if: matrix.language == 'Java'
        run: |
          cargo test -p kaji-plugin-java generated_retry_parsers_execute_with_jdk -- --ignored
          cargo test -p kaji-plugin-java native_webhook_verification_executes_canonical_vectors -- --ignored
          cargo test -p kaji-plugin-java native_generated_operation_tests_execute -- --ignored
          cargo test -p kaji-plugin-java native_models_preserve_alias_union_and_unknown_enum_wire_values -- --ignored
          cargo test -p kaji-plugin-java native_omitted_and_null_presence_roundtrip -- --ignored
          cargo test -p kaji-plugin-java native_multipart_http_bytes_preserve_unicode_falsy_and_binary -- --ignored
      - name: Verify generated C# retry parser
        if: matrix.language == 'C#'
        run: |
          cargo test -p kaji-plugin-csharp generated_retry_parser_executes_with_dotnet -- --ignored
          cargo test -p kaji-plugin-csharp generated_sse_framing_executes_with_dotnet -- --ignored
          cargo test -p kaji-plugin-csharp native_webhook_verification_executes_canonical_vectors -- --ignored
          cargo test -p kaji-plugin-csharp native_generated_operation_tests_execute -- --ignored
          cargo test -p kaji-plugin-csharp native_models_preserve_alias_union_and_unknown_enum_wire_values -- --ignored
          cargo test -p kaji-plugin-csharp native_omitted_and_null_presence_roundtrip -- --ignored
          cargo test -p kaji-plugin-csharp native_multipart_http_bytes_preserve_unicode_falsy_and_binary -- --ignored
      - name: Verify all native PHP probes
        if: matrix.language == 'PHP'
        run: cargo test -p kaji-plugin-php -- --ignored
      - name: Verify all native Elixir probes
        if: matrix.language == 'Elixir'
        run: cargo test -p kaji-plugin-elixir -- --ignored
      - name: Verify native Swift middleware models pagination and cancellation
        if: matrix.language == 'Swift'
        run: cargo test -p kaji-plugin-swift -- --ignored
      - name: Verify complex OpenAPI contract through native Swift SDK
        if: matrix.language == 'Swift'
        env:
          KAJI_OPENAPI_BIN: ${{ github.workspace }}/target/debug/kaji-openapi
        run: |
          (cd openapi && go build -o ../target/debug/kaji-openapi .)
          cargo test -p kaji --test complex_contract -- --ignored
      - name: Verify native C# URL pagination
        if: matrix.language == 'C#'
        run: cargo test -p kaji-plugin-csharp native_url_pages_reject_unsafe_origins_preserve_auth_and_cancel_lazily -- --ignored
      - name: Verify generated Rust operation tests
        if: matrix.language == 'Rust'
        run: |
          cargo test -p kaji-plugin-rust native_generated_rust_operation_tests_execute -- --ignored
          cargo test -p kaji-plugin-rust native_url_pages_preserve_origin_auth_and_raw_error_responses -- --ignored
          cargo test -p kaji-plugin-rust native_standard_webhook_vectors_execute -- --ignored
      - name: Execute generated public operations against shared runtime scenarios
        run: node packages/runtime-contract/runner.mjs "${{ matrix.path }}" "$GITHUB_WORKSPACE/runtime-contract-fixture/sdk/${{ matrix.path }}"
