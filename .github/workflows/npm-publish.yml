name: Publish release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Verify Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
      - name: Test embedded OpenAPI compiler
        working-directory: openapi
        run: go test ./...
      - name: Run generated SDK contract suite
        run: cargo test -p kaji --test sdk_to_mock_contract -- --ignored
      - name: Compile generated Rust SDK warning-free
        run: cargo test -p kaji-plugin-rust generated_retry_runtime_compiles_warning_free -- --ignored
      - name: Compile generated C# SDK
        run: cargo test -p kaji-plugin-csharp generated_csharp_project_builds_with_dotnet -- --ignored
      - name: Compile generated Java SDK
        run: cargo test -p kaji-plugin-java generated_package_compiles_with_maven -- --ignored
      - name: Lint generated PHP SDK
        run: cargo test -p kaji-plugin-php generated_package_passes_php_syntax_checks -- --ignored
      - name: Validate generated Ruby SDK
        run: cargo test -p kaji-plugin-ruby
      - name: Install TypeScript compiler
        run: npm install --prefix "$RUNNER_TEMP/kaji-typescript" --no-save typescript
      - name: Compile generated TypeScript SDK
        run: >-
          KAJI_TSC_JS="$RUNNER_TEMP/kaji-typescript/node_modules/typescript/lib/tsc.js"
          cargo test -p kaji-plugin-typescript
          generated_fetch_consumer_compiles_with_strict_typescript -- --ignored
      - name: Build Kaji and OpenAPI sidecar
        run: |
          cargo build -p kaji-cli --locked
          (cd openapi && go build -o ../target/debug/kaji-openapi .)
      - name: Generate cross-language SDK fixture
        run: >-
          target/debug/kaji generate crates/kaji-cli/tests/fixtures/pets.yaml
          --output "$RUNNER_TEMP/generated-sdk-fixture"
          --language rust,typescript,go,python,php,java,csharp,elixir,ruby,swift
          --name "CI Pets" --sdk-version 1.0.0 --color never
      - uses: actions/upload-artifact@v7
        with:
          name: generated-sdk-fixture
          path: ${{ runner.temp }}/generated-sdk-fixture
          include-hidden-files: true
          retention-days: 1

  verify-swift:
    name: Compile generated Swift SDK
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/kaji-swift-cache/clang"
          SWIFTPM_MODULECACHE_OVERRIDE="$RUNNER_TEMP/kaji-swift-cache/swiftpm"
          cargo test -p kaji-plugin-swift generated_package_builds_with_swiftpm -- --ignored

  generated-sdk:
    name: Validate generated ${{ matrix.language }} SDK
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: Rust, path: rust, runner: ubuntu-latest }
          - { language: TypeScript, path: typescript, runner: ubuntu-latest }
          - { language: Go, path: go, runner: ubuntu-latest }
          - { language: Python, path: python, runner: ubuntu-latest }
          - { language: PHP, path: php, runner: ubuntu-latest }
          - { language: Java, path: java, runner: ubuntu-latest }
          - { language: C#, path: csharp, runner: ubuntu-latest }
          - { language: Elixir, path: elixir, runner: ubuntu-latest }
          - { language: Ruby, path: ruby, runner: ubuntu-latest }
          - { language: Swift, path: swift, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdk-fixture
          path: generated-sdk-fixture
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'Rust'
      - uses: actions/setup-node@v7
        if: matrix.language == 'TypeScript'
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        if: matrix.language == 'Go'
        with:
          go-version: '1.25.7'
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'PHP'
        with:
          php-version: '8.2'
      - uses: actions/setup-java@v5
        if: matrix.language == 'Java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        if: matrix.language == 'C#'
        with:
          dotnet-version: '8.0.x'
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'Elixir'
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'Ruby'
        with:
          ruby-version: '3.1'
      - name: Validate generated SDK
        working-directory: generated-sdk-fixture/${{ matrix.path }}
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/kaji-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/kaji-swift-cache/swiftpm
        run: |
          case "${{ matrix.language }}" in
            Rust) cargo test ;;
            TypeScript) npm install --ignore-scripts && npm run build ;;
            Go) go test ./... ;;
            Python) python -m compileall -q src && PYTHONPATH=src python -c 'import ci_pets_sdk' ;;
            PHP) find src -name '*.php' -print0 | xargs -0 -n1 php -l ;;
            Java) mvn --batch-mode --no-transfer-progress -q -DskipTests compile ;;
            C#) dotnet build --configuration Release ;;
            Elixir) mix deps.get && mix compile --warnings-as-errors ;;
            Ruby) find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c ;;
            Swift) swift build --disable-sandbox ;;
          esac

  native:
    name: Build ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: openapi/go.mod
          cache-dependency-path: openapi/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo test -p kaji-cli --locked
      - run: node --test packages/cli/test/launcher.test.cjs
      - run: node packages/cli/scripts/build-platform.mjs ${{ matrix.platform }}
      - run: node packages/cli/scripts/smoke-native.mjs ${{ matrix.platform }}
      - run: node packages/python/scripts/build-wheel.mjs ${{ matrix.platform }}
      - name: Pack native package
        working-directory: packages/cli/npm/${{ matrix.platform }}
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: packages/cli/npm/${{ matrix.platform }}/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.platform }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  launchers:
    name: Pack Node launchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node --test packages/cli/test/launcher.test.cjs
      - run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - name: Pack scoped launcher
        working-directory: packages/cli
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: scoped-launcher
          path: packages/cli/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [verify, verify-swift, generated-sdk, native, launchers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-artifacts/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: scoped-launcher
          path: release-artifacts/scoped-launcher
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$(node -p "require('./packages/cli/package.json').version")"
      - name: Publish native packages
        run: |
          for package in release-artifacts/native/*.tgz; do
            npm publish "$package" --access public
          done
      - name: Publish scoped launcher
        run: npm publish release-artifacts/scoped-launcher/*.tgz --access public

  publish-python:
    name: Publish to PyPI
    needs: [verify, verify-swift, generated-sdk, native, launchers]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: release-artifacts/python
          merge-multiple: true
      - name: Verify release version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'from pathlib import Path; import re; source = Path("packages/python/setup.py").read_text(); print(re.search(r"version=\"([^\"]+)\"", source).group(1))')"
          test "$tag" = "$version"
      - name: Publish platform-native wheels
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: release-artifacts/python
