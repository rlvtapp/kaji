name: APIs.guru large contract corpus
on:
  workflow_dispatch:
    inputs:
      contracts:
        description: Comma-separated pinned contract names; empty checks all 205
        type: string
        default: ''
      language:
        description: Native target to compile; all enables every language
        type: choice
        default: go
        options: [go, all, rust, typescript, python, php, java, csharp, elixir, ruby, swift]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          TARGET: ${{ inputs.language }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          languages = ['rust', 'typescript', 'go', 'python', 'php', 'java', 'csharp', 'elixir', 'ruby', 'swift']
          target = os.environ['TARGET']
          selected = languages if target == 'all' else [target]
          assert all(language in languages for language in selected)
          print('value=' + json.dumps({'include': [{'language': language, 'runner': 'macos-14' if language == 'swift' else 'ubuntu-latest'} for language in selected]}))
          PY
  native:
    name: Corpus / ${{ matrix.language }}
    needs: select
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: openapi/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'php'
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-java@v6
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: erlef/setup-beam@v1
        if: matrix.language == 'elixir'
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.3'
      - name: Select Swift 6
        if: matrix.language == 'swift'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Initialize Hex
        if: matrix.language == 'elixir'
        run: mix local.hex --force && mix local.rebar --force
      - name: Build generator and compiler
        run: |
          (cd openapi && go build -o ../target/debug/kaji-openapi .)
          cargo build --locked -p kaji-cli
      - name: Generate and compile every selected document
        env:
          KAJI_BINARY: ${{ github.workspace }}/target/debug/kaji
          KAJI_OPENAPI_BIN: ${{ github.workspace }}/target/debug/kaji-openapi
          CORPUS_CONTRACTS: ${{ inputs.contracts }}
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/swift-clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/swift-modules
          CARGO_TARGET_DIR: ${{ runner.temp }}/guru-rust-target
        run: python3 scripts/guru-corpus.py --language "${{ matrix.language }}" --contracts "$CORPUS_CONTRACTS" --output "$RUNNER_TEMP/guru-corpus"
      - name: Keep per-contract results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guru-${{ matrix.language }}-results
          path: |
            ${{ runner.temp }}/guru-corpus/report.json
            ${{ runner.temp }}/guru-corpus/fetch-error.txt
            ${{ runner.temp }}/guru-corpus/logs
            ${{ runner.temp }}/guru-corpus/metadata
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
