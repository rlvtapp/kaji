[package]
name = "poolster-inputs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Convenience bundle of native input providers for Poolster"
publish = false

[features]
default = ["graphql", "asyncapi", "arazzo", "protobuf", "capnproto"]
graphql = ["dep:poolster-input-graphql"]
asyncapi = ["dep:poolster-input-asyncapi"]
arazzo = ["dep:poolster-input-arazzo"]
protobuf = ["dep:poolster-input-protobuf"]
capnproto = ["dep:poolster-input-capnproto"]

[dependencies]
poolster-core = { path = "../../core" }
anyhow = "1.0.102"
poolster-input-graphql = { path = "../graphql", optional = true }
poolster-input-asyncapi = { path = "../asyncapi", optional = true }
poolster-input-arazzo = { path = "../arazzo", optional = true }
poolster-input-protobuf = { path = "../protobuf", optional = true }
poolster-input-capnproto = { path = "../capnproto", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
