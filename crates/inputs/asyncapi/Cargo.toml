[package]
name = "poolster-input-asyncapi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native asyncapi input provider for Poolster"
publish = false

[dependencies]
poolster-core = { path = "../../kaji-core" }
anyhow = "1.0.102"
roas-asyncapi = { version = "=0.4.0", default-features = false, features = ["v2_6", "v3_0", "v3_1"] }
serde_json = "1.0.138"
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
