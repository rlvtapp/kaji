[package]
name = "kaji-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native command-line interface for Kaji SDK generation"
publish = false

[[bin]]
name = "kaji"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
kaji = { path = "../kaji" }
kaji-core = { path = "../kaji-core" }
kaji-inputs = { path = "../kaji-inputs" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.11.0"
tempfile = "3.27.0"
