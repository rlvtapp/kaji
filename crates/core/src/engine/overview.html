<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poolster generation plan</title>
<style>body{margin:0;background:#101721;color:#e4ebf5;font:15px system-ui}header{padding:28px 36px;border-bottom:1px solid #334155}h1{margin:0 0 10px}p{color:#aabbd0}main{padding:24px 36px}section{margin-bottom:32px;background:#172231;border:1px solid #334155;border-radius:12px;padding:20px}.graph{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:36px;min-width:750px}.lane{z-index:1}h3{font-size:13px;text-transform:uppercase;color:#9caec5;letter-spacing:1px}.node{display:block;width:100%;text-align:left;background:#22344a;color:inherit;border:1px solid #526a89;border-radius:8px;padding:14px;margin:18px 0;cursor:pointer}.node:hover,.selected{border-color:#62d7ba;background:#284859}.contract{background:#203c3a;border-color:#428b80}.badge{font-size:12px;color:#78dec6}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.details{white-space:pre-wrap;background:#0f1825;padding:18px;border-radius:8px;color:#b6c8df;min-height:60px}.scroll{overflow:auto}.stages{color:#b6c8df;font-size:13px;padding-top:16px}.invalid,.skipped{color:#ffca8d}</style>
<header><h1>Poolster generation plan</h1><p>Declared dependencies • no providers or generators executed • click a node to inspect</p><button id="download">Download JSON</button></header><main id="app"></main>
<script type="application/json" id="data">__PLAN_DATA__</script><script>
const plan=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app');
function element(tag,text,parent,className){const e=document.createElement(tag);e.textContent=text;if(className)e.className=className;if(parent)parent.append(e);return e}
for(const pkg of plan.packages){const section=element('section','',app);element('h2',pkg.path+' · '+pkg.language,section);element('p',pkg.status+(pkg.diagnostic?' — '+pkg.diagnostic:''),section,pkg.status);const wrap=element('div','',section,'scroll'),graph=element('div','',wrap,'graph');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');graph.append(svg);const lanes=['Generate plugins','Contract connections','Post plugins'].map(title=>{const lane=element('div','',graph,'lane');element('h3',title,lane);return lane});const details=element('pre','Select a plugin or contract to see its declarations.',section,'details');const nodes=new Map(),connections=[];
const inspect=(button,value)=>button.onclick=()=>{section.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));button.classList.add('selected');details.textContent=JSON.stringify(value,null,2)};
for(const plugin of [...pkg.plugins].sort((a,b)=>(a.order??a.id)-(b.order??b.id))){const button=element('button',plugin.kind,lanes[plugin.phase==='post'?2:0],'node');element('div',(plugin.order===null?'Unresolved':'Order '+(plugin.order+1))+' · '+plugin.phase,button,'badge');nodes.set(plugin.id,button);inspect(button,plugin)}
for(const edge of pkg.edges){const b=element('button',edge.contract,lanes[1],'node contract');element('div',(edge.optional?'Optional':'Required')+' · '+edge.selection, b,'badge');inspect(b,edge);if(nodes.has(edge.provider))connections.push([nodes.get(edge.provider),b]);connections.push([b,nodes.get(edge.consumer)])}
if(!pkg.edges.length)element('p','No declared typed connections. Plugins may use the legacy HTTP context.',lanes[1]);
element('div','After Generate: '+pkg.stages.join(' → '),section,'stages');
function draw(){svg.replaceChildren();const r=graph.getBoundingClientRect();for(const [a,b] of connections){if(!a||!b)continue;const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();const line=document.createElementNS(svg.namespaceURI,'path');const ax=x.right-r.left,ay=x.top+x.height/2-r.top,bx=y.left-r.left,by=y.top+y.height/2-r.top;line.setAttribute('d',`M ${ax} ${ay} C ${(ax+bx)/2} ${ay}, ${(ax+bx)/2} ${by}, ${bx} ${by}`);line.setAttribute('fill','none');line.setAttribute('stroke','#559f96');line.setAttribute('stroke-width','2');svg.append(line)}}new ResizeObserver(draw).observe(graph);requestAnimationFrame(draw)}
document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='poolster-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
