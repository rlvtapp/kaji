<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poolster · generation flowchart</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5eefb;font:14px system-ui}header{padding:28px 32px;border-bottom:1px solid #29364c}h1{margin:0;font-size:26px}p{color:#9eafc6;line-height:1.6}main{padding:24px 32px}section{margin-bottom:32px}h2{font-size:19px}.toolbar{display:flex;gap:12px;align-items:center}.toolbar button{background:#23334b;color:inherit;border:1px solid #4b617f;border-radius:6px;padding:8px 14px}.scroll{overflow:auto;border:1px solid #30415b;border-radius:10px}.canvas{position:relative;background:#101c2e}.band{position:absolute;left:0;width:100%;border-bottom:1px solid #2a3a52;background:#142238}.band:nth-child(even){background:#101c2e}.lane-title{position:absolute;left:16px;width:190px;padding-right:12px;overflow-wrap:anywhere;font-weight:600;color:#a8bfdc}.column{position:absolute;top:0;height:100%;border-left:1px dashed #334762;pointer-events:none}.column-title{position:absolute;top:15px;width:200px;color:#9fb3cf;font-size:12px;text-transform:uppercase;letter-spacing:.8px}.node{position:absolute;width:176px;min-height:70px;background:#233854;color:#e5eefb;border:1px solid #526e95;border-radius:8px;padding:10px;text-align:left;cursor:pointer;z-index:2;overflow-wrap:anywhere}.node:hover,.node.selected{border-color:#67e5c6;background:#28495c}.node strong{display:block;font-size:12px;color:#99c3ff;margin-bottom:5px}.node span{display:block;font:12px ui-monospace,monospace;line-height:1.4}.contract{background:#163c39;border-color:#428c7d}.contract strong{color:#86e1c5}.boundary{border-style:dashed;background:#1d2b40}.details{white-space:pre-wrap;overflow-wrap:anywhere;background:#101c2e;border:1px solid #30415b;border-radius:8px;padding:16px;min-height:85px;margin-top:14px}.status{color:#7cdec0}.invalid,.skipped{color:#ffc58d}svg{position:absolute;inset:0;z-index:1;pointer-events:none}.legend{font-size:12px;color:#a4b5ca}.highlight{stroke:#f8cc7e!important;stroke-width:3!important}
</style>
<header><h1>Generation flowchart</h1><p>Plugins and their registered handlers, connected through declared contracts. Columns show lifecycle stages and resolved plugin order.</p><div class="toolbar"><button id="download">Download plan JSON</button><span class="legend">Solid arrows: selected dependency · dashed arrows: plugin publication, not a predicted handler output</span></div></header>
<main id="app"></main><script type="application/json" id="data">__PLAN_DATA__</script>
<script>
const plan=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app');
function el(tag,text,parent,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e}
for(const pkg of plan.packages){
 const section=el('section','',app);el('h2',pkg.path+' / '+pkg.language,section);el('p',pkg.status+(pkg.diagnostic?' — '+pkg.diagnostic:''),section,'status '+pkg.status);
 const ordered=[...pkg.plugins].sort((a,b)=>(a.order??a.id)-(b.order??b.id));
 const generate=ordered.filter(p=>p.phase!=='post'),post=ordered.filter(p=>p.phase==='post');
 const columns=[...generate.map(p=>({title:'Generate · #'+p.id,plugin:p})),{title:'Package assembly',stage:true},...post.map(p=>({title:'Post · #'+p.id,plugin:p})),{title:'File finalization',stage:true},{title:'Customization / ownership',stage:true}];
 const contracts=[...new Set(pkg.plugins.flatMap(p=>[...p.requires,...p.provides]))].sort();
 const lanes=['Plugin entry points',...contracts,'Package lifecycle'];
 const width=230+columns.length*240,height=65+Math.max(lanes.length,...pkg.plugins.map(p=>p.handlers.length+p.provides.length+2))*150;
 const scroll=el('div','',section,'scroll'),canvas=el('div','',scroll,'canvas');canvas.style.width=width+'px';canvas.style.height=height+'px';
 const details=el('pre','Select a handler, contract publication or lifecycle boundary.',section,'details');
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',width);svg.setAttribute('height',height);canvas.append(svg);
 const defs=document.createElementNS(svg.namespaceURI,'defs'),marker=document.createElementNS(svg.namespaceURI,'marker');marker.id='arrow-'+app.children.length;marker.setAttribute('viewBox','0 0 10 10');marker.setAttribute('refX','9');marker.setAttribute('refY','5');marker.setAttribute('markerWidth','6');marker.setAttribute('markerHeight','6');marker.setAttribute('orient','auto');const triangle=document.createElementNS(svg.namespaceURI,'path');triangle.setAttribute('d','M 0 0 L 10 5 L 0 10 z');triangle.setAttribute('fill','#69bba8');marker.append(triangle);defs.append(marker);svg.append(defs);
 columns.forEach((col,index)=>{const x=230+index*240;const line=el('div','',canvas,'column');line.style.left=(x-14)+'px';el('div',col.title,canvas,'column-title').style.left=x+'px'});
 const positions=new Map(),pubs=new Map(),paths=[],groups=new Map();
 function node(x,row,title,subtitle,value,cls=''){const button=el('button','',canvas,'node '+cls);button.style.left=x+'px';button.style.top=(85+row*150)+'px';el('strong',title,button);el('span',subtitle,button);button.onclick=()=>{canvas.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));button.classList.add('selected');details.textContent=JSON.stringify(value,null,2);for(const item of paths)item.path.classList.toggle('highlight',item.a===button||item.b===button)};return button}
 function connect(a,b,dashed=false){if(!a||!b)return;const path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('fill','none');path.setAttribute('stroke','#69bba8');path.setAttribute('stroke-width','1.5');path.setAttribute('marker-end','url(#'+marker.id+')');if(dashed)path.setAttribute('stroke-dasharray','5 5');svg.append(path);paths.push({a,b,path})}
 columns.forEach((col,index)=>{const x=230+index*240;if(col.stage){node(x,0,col.title,'Lifecycle boundary',{stage:col.title,actual_stages:pkg.stages},'boundary');return}
 const plugin=col.plugin,handlers=plugin.handlers.length?plugin.handlers:['Opaque entry point'];const nodes=[];const group=node(x,0,plugin.label,'Plugin #'+plugin.id,plugin,'boundary');groups.set(plugin.id,group);
 handlers.forEach((handler,hi)=>{const match=contracts.filter(c=>handler.includes('<'+c+'>')||handler.includes('<'+c+',')||handler.includes(', '+c+'>')).sort((a,b)=>b.length-a.length)[0];const row=hi+1;const button=node(x,row,plugin.label,handler,{plugin,handler,scope:'Handler label is declared metadata; internal behavior is not traced.'});button.style.top=(85+row*150+hi*5)+'px';nodes.push({button,contract:match});});positions.set(plugin.id,nodes);
 plugin.provides.forEach(contract=>{const row=handlers.length+1+plugin.provides.indexOf(contract);const publication=node(x+45,row,contract,'Published by #'+plugin.id,{provider:plugin.id,contract,scope:'Plugin-level publication; exact producing callback unknown.'},'contract');publication.style.top=(160+row*150)+'px';pubs.set(plugin.id+'|'+contract,publication);connect(group,publication,true)});
 });
 for(const edge of pkg.edges){const targets=positions.get(edge.consumer)??[];const target=targets.find(n=>n.contract===edge.contract);const endpoint=target?.button??(targets.length===1?targets[0].button:groups.get(edge.consumer));let source=pubs.get(edge.provider+'|'+edge.contract);if(!source){const row=contracts.indexOf(edge.contract)+1;source=node(230-12,row,edge.contract,edge.optional?'Optional / unbound':'Missing provider',edge,'contract boundary');source.style.top=(160+row*150)+'px'}connect(source,endpoint)}
 function draw(){const base=canvas.getBoundingClientRect();for(const item of paths){const a=item.a.getBoundingClientRect(),b=item.b.getBoundingClientRect();const ax=a.right-base.left,ay=a.top+a.height/2-base.top,bx=b.left-base.left,by=b.top+b.height/2-base.top;const bend=Math.max(35,Math.abs(bx-ax)/2);item.path.setAttribute('d',`M ${ax} ${ay} C ${ax+bend} ${ay}, ${bx-bend} ${by}, ${bx} ${by}`)}}new ResizeObserver(draw).observe(canvas);requestAnimationFrame(draw);
 el('p','Plan only: callbacks are not executed. Block contents, revisions and actual generated files are unknown. Handler order inside a plugin is not shown as independent execution steps.',section,'legend');
}
document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='poolster-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
