[package]
name = "poolster-plugin-typescript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TypeScript SDK generators and typed package integration for Poolster"
publish = ["crates-io"]

[dependencies]
anyhow = "1.0.102"
poolster-core = { version = "0.5.0-alpha.1", path = "../../core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"

[dev-dependencies]
tempfile = "3.27.0"

poolster-input-graphql = { version = "0.5.0-alpha.1", path = "../../inputs/graphql" }

poolster-input-arazzo = { version = "0.5.0-alpha.1", path = "../../inputs/arazzo" }
poolster-input-asyncapi = { version = "0.5.0-alpha.1", path = "../../inputs/asyncapi" }
