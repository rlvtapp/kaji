[package]
name = "poolster-plugin-terraform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terraform provider generator for Poolster"
publish = ["crates-io"]

[dependencies]
anyhow = "1.0.102"
poolster-core = { version = "0.5.0-alpha.1", path = "../../core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
