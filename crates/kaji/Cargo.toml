[package]
name = "poolster"
version.workspace = true
edition = "2024"
description = "Multi-language OpenAPI SDK generation profiles"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Compatibility surface for the CLI, Node addon, and existing examples.
# New Rust consumers can depend on individual plugin crates directly.
all-plugins = [
    "csharp", "dotnet", "elixir", "go", "java", "php", "postman", "python",
    "ruby", "rust", "rust-cli", "swift", "symfony", "terraform",
    "typescript", "typescript-cli",
]
csharp = ["dep:poolster-plugin-csharp"]
dotnet = ["dep:poolster-plugin-dotnet"]
elixir = ["dep:poolster-plugin-elixir"]
go = ["dep:poolster-plugin-go"]
java = ["dep:poolster-plugin-java"]
php = ["dep:poolster-plugin-php"]
postman = ["dep:poolster-plugin-postman"]
python = ["dep:poolster-plugin-python"]
ruby = ["dep:poolster-plugin-ruby"]
rust = ["dep:poolster-plugin-rust"]
rust-cli = ["dep:poolster-plugin-rust-cli"]
swift = ["dep:poolster-plugin-swift"]
symfony = ["dep:poolster-plugin-symfony"]
terraform = ["dep:poolster-plugin-terraform"]
typescript = ["dep:poolster-plugin-typescript"]
typescript-cli = ["dep:poolster-plugin-typescript-cli"]

[dependencies]
anyhow = "1.0.102"
poolster-core = { path = "../kaji-core" }
poolster-plugin-rust = { path = "../plugins/rust", optional = true }
poolster-plugin-typescript = { path = "../plugins/typescript", optional = true }
poolster-plugin-typescript-cli = { path = "../plugins/typescript-cli", optional = true }
poolster-plugin-rust-cli = { path = "../plugins/rust-cli", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
poolster-plugin-go = { path = "../plugins/go", optional = true }
poolster-plugin-python = { path = "../plugins/python", optional = true }
poolster-plugin-php = { path = "../plugins/php", optional = true }
poolster-plugin-symfony = { path = "../plugins/symfony", optional = true }
poolster-plugin-java = { path = "../plugins/java", optional = true }
poolster-plugin-csharp = { path = "../plugins/csharp", optional = true }
poolster-plugin-dotnet = { path = "../plugins/dotnet", optional = true }
poolster-plugin-elixir = { path = "../plugins/elixir", optional = true }
poolster-plugin-ruby = { path = "../plugins/ruby", optional = true }
poolster-plugin-swift = { path = "../plugins/swift", optional = true }

poolster-plugin-terraform = { path = "../plugins/terraform", optional = true }
poolster-plugin-postman = { path = "../plugins/postman", optional = true }

[dev-dependencies]
serde_json = "1.0.138"
tempfile = "3.27.0"

[[example]]
name = "generate_sdk_preview"
required-features = ["go", "typescript"]

[[test]]
name = "complex_contract"
required-features = ["all-plugins"]

[[test]]
name = "custom_methods"
required-features = ["all-plugins"]

[[test]]
name = "golden_output"
required-features = ["all-plugins"]

[[test]]
name = "runtime_conformance"
required-features = ["all-plugins"]

[[test]]
name = "sdk_contract"
required-features = ["all-plugins"]

[[test]]
name = "sdk_to_mock_contract"
required-features = ["all-plugins"]

[[test]]
name = "typed_packages"
required-features = ["all-plugins"]
