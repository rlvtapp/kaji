[package]
name = "kaji"
version = "0.4.0"
edition = "2024"
description = "Multi-language OpenAPI SDK generation profiles"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.102"
kaji-core = { path = "../kaji-core" }
kaji-plugin-rust = { path = "../plugins/rust" }
kaji-plugin-typescript = { path = "../plugins/typescript" }
kaji-plugin-typescript-cli = { path = "../plugins/typescript-cli" }
kaji-plugin-rust-cli = { path = "../plugins/rust-cli" }
serde = { version = "1.0.219", features = ["derive"] }
kaji-plugin-go = { path = "../plugins/go" }
kaji-plugin-python = { path = "../plugins/python" }
kaji-plugin-php = { path = "../plugins/php" }
kaji-plugin-symfony = { path = "../plugins/symfony" }
kaji-plugin-java = { path = "../plugins/java" }
kaji-plugin-csharp = { path = "../plugins/csharp" }
kaji-plugin-dotnet = { path = "../plugins/dotnet" }
kaji-plugin-elixir = { path = "../plugins/elixir" }
kaji-plugin-ruby = { path = "../plugins/ruby" }
kaji-plugin-swift = { path = "../plugins/swift" }

[dev-dependencies]
serde_json = "1.0.138"
tempfile = "3.27.0"
