[package]
name = "poolster-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native command-line interface for Poolster SDK generation"
publish = false

[[bin]]
name = "poolster"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
poolster = { version = "0.5.0-alpha.1", path = "../facade", features = ["all-plugins"] }
poolster-core = { version = "0.5.0-alpha.1", path = "../core" }
poolster-inputs = { version = "0.5.0-alpha.1", path = "../inputs/bundle" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.11.0"
tempfile = "3.27.0"
