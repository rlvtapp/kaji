openapi: 3.1.0
info:
  title: Notes API
  version: 1.0.0
paths:
  /notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      x-kaji-mock:
        scenarios:
          - name: rate-limited
            when:
              headers: { x-test-scenario: rate-limited }
            response:
              status: 429
              headers: { retry-after: "1" }
              body: { message: Too many requests }
      responses:
        '200':
          description: A note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
components:
  schemas:
    Note:
      type: object
      required: [id, body]
      properties:
        id: { type: string, example: note_123 }
        body: { type: string, example: Remember milk }
