openapi: 3.1.0
info:
  title: Notes API
  version: 1.0.0
paths:
  /notes/{noteId}:
    get:
      operationId: getNote
      tags: [notes]
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: A note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
components:
  schemas:
    Note:
      type: object
      required: [id, body]
      properties:
        id: { type: string }
        body: { type: string }
