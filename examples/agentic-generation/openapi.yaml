openapi: 3.1.0
info:
  title: Tasks API
  version: 1.0.0
paths:
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
components:
  schemas:
    Task:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
