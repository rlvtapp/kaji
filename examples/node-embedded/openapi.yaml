openapi: 3.1.0
info:
  title: Widgets API
  version: 1.0.0
servers:
  - url: https://api.example.test
components:
  securitySchemes:
    WidgetKey:
      type: apiKey
      in: header
      name: X-Widget-Key
  schemas:
    Widget:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CreateWidget:
      type: object
      required: [name]
      properties:
        name: { type: string }
paths:
  /widgets:
    get:
      operationId: listWidgets
      tags: [widgets]
      security:
        - WidgetKey: []
      responses:
        '200':
          description: Widgets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Widget' }
    post:
      operationId: createWidget
      tags: [widgets]
      security:
        - WidgetKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWidget' }
      responses:
        '201':
          description: Created widget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      tags: [widgets]
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Widget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
  /internal/health:
    get:
      operationId: internalHealth
      responses:
        '200':
          description: Health
