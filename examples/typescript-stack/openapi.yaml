openapi: 3.0.3
info:
  title: Poolster Pets
  version: 1.0.0
  description: A compact contract used by Poolster's complete TypeScript example.
servers:
  - url: https://api.example.test/v1
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      responses:
        '200':
          description: A page of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePet'
      responses:
        '201':
          description: The created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      summary: Get one pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: No pet exists with that identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Pet:
      type: object
      required: [id, name, species]
      properties:
        id:
          type: string
          example: pet_123
        name:
          type: string
          example: Mochi
        species:
          type: string
          enum: [cat, dog, rabbit]
          example: cat
    PetList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    CreatePet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
        species:
          type: string
          enum: [cat, dog, rabbit]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
